<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Geo Empire – Accueil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Geo Empire</h1>
    <nav>
        <a href="carte.html">Carte</a>
        <a href="entreprises.html">Entreprises</a>
        <a href="immobilier.html">Immobilier</a>
        <a href="finances.html">Finances</a>
        <a href="prestige.html">Prestige</a>
        <a href="profil.html">Profil</a>
        <a href="boutique.html">Boutique</a>
    </nav>
</header>

<div id="topbar">
    <span id="solde">0</span> €
    | Tokens : <span id="tokens">0</span>
    | Crowns : <span id="crowns">0</span>
</div>

<!-- 🟦 CONSOLE CENTRALE -->
<div id="console-principale">

    <div id="console-boutons">
        <button class="btn-console btn-bleu" data-section="carte">Carte</button>
        <button class="btn-console btn-vert" data-section="entreprises">Entreprises</button>
        <button class="btn-console btn-orange" data-section="immobilier">Immobilier</button>
        <button class="btn-console btn-jaune" data-section="finances">Finances</button>
        <button class="btn-console btn-violet" data-section="prestige">Prestige</button>
        <button class="btn-console btn-rose" data-section="profil">Profil</button>
        <button class="btn-console btn-rouge" data-section="boutique">Boutique</button>
    </div>

    <div id="console-contenu">
        <h2>Bienvenue dans Geo Empire</h2>
        <p>Sélectionne une section pour commencer.</p>
    </div>

</div>
<!-- 🟦 FIN CONSOLE CENTRALE -->

<main></main>

<!-- CORE -->
<script type="module" src="./js/core/geoData.js"></script>
<script type="module" src="./js/core/entrepriseCore.js"></script>
<script type="module" src="./js/core/core.js"></script>
<script type="module" src="./js/core/systeme.js"></script>
<script type="module" src="./js/core/ui.js"></script>

<!-- SCRIPT NAVIGATION DES BOUTONS -->
<script>
document.querySelectorAll('.btn-console').forEach(btn => {
    btn.addEventListener('click', () => {
        const page = btn.dataset.section + ".html";
        window.location.href = page;
    });
});
</script>

</body>
</html>
