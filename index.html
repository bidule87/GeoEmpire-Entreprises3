<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Geo Empire – Accueil</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

<header id="header-accueil">
    <h1>Geo Empire</h1>
</header>

<div id="topbar">
    <span id="solde">0</span> €
    | Tokens : <span id="tokens">0</span>
    | Crowns : <span id="crowns">0</span>
</div>

<div id="console-principale">

    <div id="console-boutons">
        <button class="btn-console btn-bleu" data-section="carte">Carte</button>
        <button class="btn-console btn-bleu" data-section="entreprises">Entreprises</button>
        <button class="btn-console btn-bleu" data-section="immobilier">Immobilier</button>
        <button class="btn-console btn-bleu" data-section="finances">Finances</button>
        <button class="btn-console btn-bleu" data-section="prestige">Prestige</button>
        <button class="btn-console btn-bleu" data-section="profil">Profil</button>
        <button class="btn-console btn-bleu" data-section="boutique">Boutique</button>
    </div>

    <div id="console-contenu">
        <h2>Bienvenue dans Geo Empire</h2>
        <p>Sélectionne une section pour commencer.</p>
    </div>

</div>

<main></main>

<script type="module" src="./js/core/geoData.js"></script>
<script type="module" src="./js/core/entrepriseCore.js"></script>
<script type="module" src="./js/core/core.js"></script>
<script type="module" src="./js/core/systeme.js"></script>
<script type="module" src="./js/core/ui.js"></script>

<script>
document.querySelectorAll('.btn-console').forEach(btn => {
    btn.addEventListener('click', () => {
        const page = btn.dataset.section + ".html";
        window.location.href = page;
    });
});
</script>

</body>
</html>
