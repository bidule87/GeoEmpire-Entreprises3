<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Empire – Accueil</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="menu-container">

        <!-- BARRE DU HAUT CONNECTÉE AU JEU -->
        <div class="topbar-resources">
            <div class="entreprise-badge" id="nom-entreprise">Mon Empire</div>
            <div class="monnaies">
                <div class="monnaie-item"><span id="solde">50 000</span> Ø</div>
                <div class="monnaie-item">Tokens : <span id="tokens">10</span> GT</div>
                <div class="monnaie-item">Crowns : <span id="crowns">0</span> CRW</div>
            </div>
        </div>

        <h1 class="title">GEO EMPIRE</h1>
        <p class="subtitle">Conquérez les commerces autour de vous et bâtissez votre empire.</p>

        <!-- GRILLE DES 6 SECTIONS ACTIVES -->
      <div class="menu-grid">
            <a href="carte.html" class="menu-btn carte">Carte (GPS)</a>
            <a href="entreprises.html" class="menu-btn entreprises">Entreprises</a>
            <a href="mairie.html" class="menu-btn mairie">Mairie & Tchat</a>
            <a href="boutique.html" class="menu-btn boutique">Boutique</a>
            <a href="historique.html" class="menu-btn historique">Historique</a>
            <a href="profil.html" class="menu-btn profil">Profil</a>
            <a href="regles.html" class="menu-btn regles">Règles du jeu</a>
        </div>

    </div>

    <!-- CONNEXION AU MOTEUR CENTRAL -->
    <script type="module">
        import { getData } from './js/core/geoData.js';

        function actualiserAccueil() {
            const e = getData().entreprise;
            document.getElementById('nom-entreprise').textContent = e.nom || "Mon Empire";
            document.getElementById('solde').textContent = (e.argent || 0).toLocaleString('fr-FR');
            document.getElementById('tokens').textContent = (e.tokens || 0).toLocaleString('fr-FR');
            document.getElementById('crowns').textContent = (e.crowns || 0).toLocaleString('fr-FR');
        }

        actualiserAccueil();
    </script>
</body>
</html>
