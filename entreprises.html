<div id="topbar">

    | Tokens : <span id="tokens">0</span> GT
    | Crowns : <span id="crowns">0</span> CRW
</div>

<div id="entreprises-menu">
    <button data-tab="entreprise">Entreprise</button>
    <button data-tab="acheter">Acheter</button>
    <button data-tab="assurances">Assurances</button>
    <button data-tab="renovation">Rénovation</button>
    <button data-tab="proprietes">Propriétés</button>
    <button data-tab="personnel">Personnel</button>
    <button data-tab="marketing">Marketing</button>
    <button data-tab="finances">Finances</button>
    <button data-tab="patrimoine">Patrimoine</button>
    <button data-tab="gestion">Gestion</button>
    <button data-tab="historique">Historique</button>
</div>

<main id="entreprises-container">
    <div id="entreprise" class="tab"></div>

    <select id="filtre-acheter" style="display:none;"></select>
    <div id="acheter" class="tab" style="display:none;">
        <button id="export-acheter" style="display:none;">Exporter CSV</button>
    </div>

    <div id="assurances" class="tab" style="display:none;"></div>
    <div id="renovation" class="tab" style="display:none;"></div>
    <div id="proprietes" class="tab" style="display:none;"></div>
    <div id="personnel" class="tab" style="display:none;"></div>

    <div id="marketing" class="tab" style="display:none;">
        <div class="premium-panel">
            <div class="premium-title">Marketing — Entreprises</div>
            <div id="marketing-contenu" class="marketing-grid"></div>
        </div>
    </div>

    <div id="finances" class="tab" style="display:none;"></div>
    <div id="patrimoine" class="tab" style="display:none;"></div>
    <div id="gestion" class="tab" style="display:none;"></div>
    <div id="historique" class="tab" style="display:none;"></div>
</main>

<!-- CORE -->
<script type="module" src="./js/core/geoData.js"></script>

<script type="module" src="./js/core/modules/finances.js"></script>
<script type="module" src="./js/core/modules/patrimoine.js"></script>
<script type="module" src="./js/core/modules/gestion.js"></script>
<script type="module" src="./js/core/modules/historiqueEntreprises.js"></script>

<!-- SYSTÈME D'ONGLETS EN MODULE (s'exécute après le chargement des scripts) -->
<script type="module">
    const tabs = document.querySelectorAll(".tab");
    const buttons = document.querySelectorAll("#entreprises-menu button");

    function ouvrirOnglet(target) {
        tabs.forEach(t => t.style.display = "none");
        const filtre = document.getElementById("filtre-acheter");
        if (filtre && target !== "acheter") filtre.style.display = "none";

        const cible = document.getElementById(target);
        if (cible) cible.style.display = "block";

        const fnName = "init" + target.charAt(0).toUpperCase() + target.slice(1);
        if (typeof window[fnName] === "function") {
            window[fnName]();
        }
    }

    buttons.forEach(btn => {
        btn.addEventListener("click", () => ouvrirOnglet(btn.dataset.tab));
    });

    ouvrirOnglet("entreprise");
</script>

</body>
</html>
