<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Empire – Carte GPS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .carte-wrapper {
            max-width: 1350px;
            margin: 18px auto;
            padding: 18px;
            background: rgba(0, 25, 45, 0.86);
            border: 1px solid rgba(0, 150, 255, 0.4);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            color: #d9eaff;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.65);
        }
        .gps-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 12px 16px;
            background: rgba(0, 40, 70, 0.78);
            border-radius: 10px;
            border: 1px solid rgba(0, 150, 255, 0.35);
        }
        .gps-controls select, .gps-controls button {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 150, 255, 0.5);
            background: rgba(0, 60, 110, 0.92);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .gps-controls button:hover {
            background: #0077c8;
        }
        .btn-empire {
            background: rgba(2, 132, 199, 0.9) !important;
            border-color: #38bdf8 !important;
        }
        .btn-reset {
            background: rgba(185, 28, 28, 0.85) !important;
            border-color: #f87171 !important;
        }
        .legende-map {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            background: rgba(0, 20, 40, 0.75);
            padding: 9px 14px;
            border-radius: 8px;
        }
        .dot-legende {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }

        /* Conteneur Map + Volet latéral rétractable */
        .map-layout {
            position: relative;
            display: flex;
            height: 560px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(0, 150, 255, 0.45);
        }
        #map {
            flex: 1;
            height: 100%;
            z-index: 1;
        }

        /* Bouton languette pour ouvrir/fermer le volet */
        .btn-toggle-volet {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 500;
            padding: 9px 14px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            background: rgba(0, 35, 65, 0.92);
            color: #7ec8ff;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.25s ease;
        }
        .btn-toggle-volet:hover {
            background: #0284c7;
            color: #fff;
        }

        /* Volet latéral roulant */
        .volet-lateral {
            width: 360px;
            max-width: 88vw;
            height: 100%;
            background: rgba(4, 24, 46, 0.95);
            border-left: 1px solid rgba(56, 189, 248, 0.45);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, opacity 0.25s ease;
            z-index: 450;
        }
        .volet-lateral.ferme {
            width: 0;
            border-left: none;
            overflow: hidden;
            opacity: 0;
        }
        .volet-header {
            padding: 14px;
            padding-top: 52px;
            background: rgba(0, 45, 85, 0.85);
            border-bottom: 1px solid rgba(0, 150, 255, 0.35);
        }
        .volet-header select {
            width: 100%;
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(0, 25, 50, 0.95);
            color: #fff;
            border: 1px solid rgba(56, 189, 248, 0.5);
            font-weight: bold;
        }
        .volet-liste {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .volet-item {
            background: rgba(0, 45, 80, 0.78);
            border: 1px solid rgba(0, 150, 255, 0.3);
            border-radius: 9px;
            padding: 11px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.2s ease;
        }
        .volet-item:hover {
            border-color: #38bdf8;
            transform: translateX(-2px);
        }
        .volet-item-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

            flex: 1;
            padding: 6px 8px;
            border-radius
